workflow:
   rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - docker build -t furni-decor-api:$CI_COMMIT_SHORT_SHA .

deploy:
  stage: deploy
  script:
    - echo "commit sha: $CI_COMMIT_SHORT_SHA" && cd /home/gitlab-runner/furnidecor && bash deploy.sh --backend --backend-tag "$CI_COMMIT_SHORT_SHA"
